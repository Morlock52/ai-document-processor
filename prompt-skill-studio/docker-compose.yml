services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5433:5432"
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 600
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_PASSCODE: ${STUDIO_PASSCODE:-change-me}
      STUDIO_MASTER_KEY: ${STUDIO_MASTER_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - studio_blobs:/app/blobs

  worker:
    build:
      context: ./backend
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_MASTER_KEY: ${STUDIO_MASTER_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - studio_blobs:/app/blobs

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: http://api:8000/api/v1
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  studio_pg:
  studio_blobs:
